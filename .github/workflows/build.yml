name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install reportlab pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed csv_to_pdf_gui (1).py

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: csv_to_pdf_gui-windows-exe
          path: dist/csv_to_pdf_gui.exe
